<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Mock Email / SMS Viewer</title>

  <!-- React -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- DOMPurify (required for prod safety) -->
  <script src="https://unpkg.com/dompurify@3.0.6/dist/purify.min.js"></script>

  <!-- UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">

    function SafeEmailBody({ mail }) {
      if (mail.html) {
        const safeHtml = DOMPurify.sanitize(mail.html);
        return (
          <div
            className="prose max-w-none"
            dangerouslySetInnerHTML={{ __html: safeHtml }}
          />
        );
      }
      return <pre className="whitespace-pre-wrap">{mail.text}</pre>;
    }

    function Attachments({ attachments }) {
      if (!attachments || attachments.length === 0) {
        return null;
      }

      return (
        <div className="mt-3">
          <h4 className="text-sm font-semibold text-gray-600 mb-1">
            Attachments
          </h4>

          {attachments.map((att, i) => (
            <a
              key={i}
              href={`data:${att.contentType};base64,${att.content}`}
              download={att.filename}
              className="flex items-center gap-2 text-blue-600 hover:underline text-sm"
            >
              <i className="fa fa-file-pdf text-red-500"></i>
              {att.filename} ({Math.round(att.size / 1024)} KB)
            </a>
          ))}
        </div>
      );
    }

    function Email() {
      const [mails, setMails] = React.useState([]);
      const [status, setStatus] = React.useState(false);

      React.useEffect(() => {
        fetch("/config")
          .then(res => res.json())
          .then(cfg => {
            const wsUrl = `${cfg.wsProtocol}://${window.location.hostname}:${cfg.wsPort}${cfg.basePath}`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => setStatus(true);
            ws.onclose = () => setStatus(false);

            ws.onmessage = e => {
              const msg = JSON.parse(e.data);
              setMails(prev => [msg, ...prev]);
            };
          });
      }, []);

      return (
        <div className="p-6">
          <h1 className="text-2xl font-bold mb-4"> SMTP mock server</h1>
          <div className="flex items-center gap-2 mb-4">
            <span
              className={`relative flex h-3 w-3`}
            >
              <span
                className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75
        ${status ? "bg-green-400" : "bg-red-400"}
      `}
              />
              <span
                className={`relative inline-flex rounded-full h-3 w-3
        ${status ? "bg-green-500" : "bg-red-500"}
      `}
              />
            </span>

            <span className="text-sm font-medium text-gray-700">
              Connection:
              <span
                className={`ml-1 font-semibold ${status ? "text-green-600" : "text-red-600"
                  }`}
              >
                {status ? "Connected" : "Disconnected"}
              </span>
            </span>
          </div>


          {mails.map((mail, idx) => (
            <div key={idx} className="bg-white rounded shadow p-4 mb-4">
              <div className="text-base text-gray-500">
                To: {mail.to?.text} | From: {mail.from?.text}
              </div>
              <div className="text-lg font-semibold">{mail.subject}</div>
              <div className="text-sm text-gray-400">
                {new Date(mail.date).toLocaleString()}
              </div>

              <hr className="my-2" />

              <SafeEmailBody mail={mail} />

              <Attachments attachments={mail.attachments} />
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.render(<Email />, document.getElementById("root"));
  </script>
</body>

</html>
